<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sinoo — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 2.5rem 2.25rem 2rem;
      width: 100%;
      max-width: 400px;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #71896B;
      letter-spacing: -0.5px;
      margin-bottom: 0.35rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
    }

    .field { margin-bottom: 1.25rem; }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.97rem;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #71896B;
      box-shadow: 0 0 0 3px rgba(113,137,107,0.18);
    }

    .error {
      background: #fff5f5;
      border: 1.5px solid #feb2b2;
      border-radius: 8px;
      color: #c53030;
      font-size: 0.88rem;
      padding: 0.7rem 1rem;
      margin-bottom: 1.25rem;
    }

    .btn-primary {
      width: 100%;
      background: #71896B;
      color: #fff;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.97rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover { background: #5a7055; }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
      color: #cbd5e0;
      font-size: 0.82rem;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    .btn-admin {
      width: 100%;
      background: transparent;
      color: #4a5568;
      border: 1.5px solid #e2e8f0;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
      display: block;
      text-align: center;
    }

    .btn-admin:hover {
      background: #f7fafc;
      border-color: #cbd5e0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">sinoo</div>
    <div class="subtitle">Sign in to access your workspace</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ base_path }}/login">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <div class="divider">or</div>
    <a href="{{ base_path }}/admin/login" class="btn-admin">Admin Login</a>
  </div>
</body>
</html>
