<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sinoo — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 2.5rem 2.25rem 2rem;
      width: 100%;
      max-width: 400px;
    }

    h1, h2, h3, h4, h5, h6, .logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #71896B;
      letter-spacing: -0.5px;
      margin-bottom: 0.35rem;
    }

    .badge {
      display: inline-block;
      background: #71896B;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      margin-left: 0.4rem;
      vertical-align: middle;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 2rem;
      margin-top: 0.35rem;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
    }

    .field { margin-bottom: 1.25rem; }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.97rem;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #71896B;
      box-shadow: 0 0 0 3px rgba(113,137,107,0.18);
    }

    .error {
      background: #fff5f5;
      border: 1.5px solid #feb2b2;
      border-radius: 8px;
      color: #c53030;
      font-size: 0.88rem;
      padding: 0.7rem 1rem;
      margin-bottom: 1.25rem;
    }

    .btn-primary {
      width: 100%;
      background: #71896B;
      color: #fff;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.97rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover { background: #5a7055; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.88rem;
      color: #718096;
      text-decoration: none;
    }

    .back-link:hover { color: #4a5568; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">sinoo <span class="badge">Admin</span></div>
    <div class="subtitle">Admin access — ICP editor and settings</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ base_path }}/admin/login">
      <div class="field">
        <label for="username">Admin Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required />
      </div>
      <div class="field">
        <label for="password">Admin Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-primary">Sign in as Admin</button>
    </form>

    <a href="{{ base_path }}/login" class="back-link">Back to user login</a>
  </div>
</body>
</html>
