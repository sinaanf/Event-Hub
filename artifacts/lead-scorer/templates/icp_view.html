<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sinoo — Ideal Customer Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      min-height: 100vh;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    header {
      background: #71896B;
      color: #fff;
      padding: 1.25rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #fff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn-header {
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      font-size: 0.82rem;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .btn-header:hover { background: rgba(255,255,255,0.1); color: #fff; }

    .btn-header-primary {
      color: rgba(255,255,255,0.9);
      font-weight: 600;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
    }
    .btn-header-primary:hover { background: rgba(255,255,255,0.22); color: #fff; }

    main {
      max-width: 760px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }

    .page-title {
      margin-bottom: 1.5rem;
    }

    .page-title h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a1a2e;
    }

    .page-title p {
      margin-top: 0.35rem;
      color: #6b7280;
      font-size: 0.9rem;
    }

    .icp-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 1.75rem 2rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .icp-text {
      font-size: 0.92rem;
      line-height: 1.75;
      color: #374151;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .readonly-notice {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #fef9c3;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.84rem;
      color: #92400e;
      margin-bottom: 1.25rem;
    }

    .readonly-notice svg {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
    }

    .admin-edit-link {
      margin-left: auto;
      font-weight: 600;
      color: #92400e;
      text-decoration: underline;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<header>
  <h1>sinoo</h1>
  <div class="header-actions">
    <a href="{{ base_path }}/" class="btn-header">← Back to Scraper</a>
    {% if is_admin %}
    <a href="{{ base_path }}/admin" class="btn-header btn-header-primary">Edit ICP</a>
    {% endif %}
    <a href="{{ base_path }}/logout" class="btn-header">Logout</a>
  </div>
</header>

<main>
  <div class="page-title">
    <h2>Ideal Customer Profile</h2>
    <p>This is the ICP used to score every lead extracted from a scraped page.</p>
  </div>

  {% if not is_admin %}
  <div class="readonly-notice">
    <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.345 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 5a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 5zm0 9a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>
    <span>This ICP is managed by your admin. Contact your admin to request changes.</span>
  </div>
  {% endif %}

  <div class="icp-card">
    <pre class="icp-text">{{ icp }}</pre>
  </div>
</main>

</body>
</html>
